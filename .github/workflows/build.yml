name: Build and push images

# Every push builds and pushes both images to GHCR under this repo's name:
#   ghcr.io/<owner>/stealth-chrome:latest          (slim)
#   ghcr.io/<owner>/stealth-chrome:record          (record variant)
# plus immutable sha-tagged copies of each.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

      - name: Build and push record image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: record
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=record
          cache-to: type=gha,mode=max,scope=record
          tags: |
            ghcr.io/${{ github.repository }}:record
            ghcr.io/${{ github.repository }}:record-sha-${{ github.sha }}
